    <line x1="638" y1="76" x2="654" y2="76" stroke="#94a3b8" stroke-width="1.1"/>
    <line x1="654" y1="34" x2="654" y2="118" stroke="#94a3b8" stroke-width="1.1"/>
    <line x1="654" y1="34" x2="668" y2="34" stroke="#94a3b8" stroke-width="1.1"/>
    <rect x="668" y="23" width="152" height="22" rx="5" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/>
    <circle cx="680" cy="34" r="2.3" fill="#0284c7" opacity="0.85"/>
    <text x="690" y="37.2" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">Kitty / Ghostty HD</text>
    <line x1="654" y1="62" x2="668" y2="62" stroke="#94a3b8" stroke-width="1.1"/>
