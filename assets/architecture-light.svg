<svg xmlns="http://www.w3.org/2000/svg" width="848" height="156" viewBox="0 0 848 156" role="img" aria-label="iutui runtime architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fb"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="archGlow" cx="0.38" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="848" height="156" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
