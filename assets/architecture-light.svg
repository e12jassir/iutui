    <!-- Stage 1 -->
    <rect x="28" y="42" width="182" height="80" rx="8" fill="#ffffff" stroke="#d5dce5" stroke-width="1"/>
    <text x="42" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Discovery &amp; Feeds</text>
    <text x="42" y="88" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">InnerTube &#x00b7; yt-dlp</text>
    <text x="42" y="105" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">Local Atom RSS</text>

    <line x1="210" y1="82" x2="239" y2="82" stroke="#94a3b8" stroke-width="1.3"/>
    <path d="M235 79 L240 82 L235 85" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 2 -->
    <rect x="242" y="42" width="186" height="80" rx="8" fill="#ffffff" stroke="#0284c7" stroke-opacity="0.7" stroke-width="1"/>
    <text x="256" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Pure-Go Core</text>
    <text x="256" y="88" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">Bubble Tea &#x00b7; Worker Pool</text>
    <text x="256" y="105" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">LRU Thumbs &#x00b7; XDG State</text>

    <line x1="428" y1="82" x2="457" y2="82" stroke="#94a3b8" stroke-width="1.3"/>
    <path d="M453 79 L458 82 L453 85" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

