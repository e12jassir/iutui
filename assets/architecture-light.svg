    <circle cx="680" cy="62" r="2.3" fill="#0284c7" opacity="0.85"/>
    <text x="690" y="65.2" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">MPRIS2 D-Bus</text>
    <line x1="654" y1="90" x2="668" y2="90" stroke="#94a3b8" stroke-width="1.1"/>
    <rect x="668" y="79" width="152" height="22" rx="5" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/>
    <circle cx="680" cy="90" r="2.3" fill="#0284c7" opacity="0.85"/>
    <text x="690" y="93.2" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">SponsorBlock</text>
    <line x1="654" y1="118" x2="668" y2="118" stroke="#94a3b8" stroke-width="1.1"/>
    <rect x="668" y="107" width="152" height="22" rx="5" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/>
    <circle cx="680" cy="118" r="2.3" fill="#0284c7" opacity="0.85"/>
    <text x="690" y="121.2" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">LRCLIB Lyrics</text>
