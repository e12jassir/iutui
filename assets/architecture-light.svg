    <rect x="460" y="42" width="178" height="80" rx="8" fill="#ffffff" stroke="#d5dce5" stroke-width="1"/>
    <text x="474" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Playback Engine</text>
    <text x="474" y="88" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#475569">mpv JSON IPC</text>
    <text x="474" y="105" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">24 MiB Bounded Cache</text>

