version: 2

project_name: iutui

before:
  hooks:
    - go mod tidy

builds:
  - id: iutui
    main: ./cmd/iutui
    binary: iutui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: packages
    package_name: iutui
    homepage: https://github.com/e12jassir/iutui
    maintainer: Esteban Marrugo
    description: Fast, keyboard-first YouTube TUI and CLI powered by mpv IPC and yt-dlp
    license: MIT
    formats:
      - deb
      - rpm
    dependencies:
      - mpv
      - yt-dlp
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
